apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}-db
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${APP_NAME}-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APP_NAME}-db
  template:
    metadata:
      labels:
        app: ${APP_NAME}-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: grades
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: grades
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-db
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: ${APP_NAME}-db
  ports:
    - port: 5432
      targetPort: 5432
